# Copy to config/fabrica.toml (git-ignored) and replace the example ids with your own Claude Code session ids.
# Factory board: which Claude Code sessions are stations. Same content as the old scripts/fabrica-config.json.
# Re-read on every refresh, no restart needed. The order of [[sessoes]] is the order (and number) of the benches.
# Ids the page draws: impl, labs, design, narrativa, mecanicas, modelos, musica; any other id is a generic town.
# `espera` is optional and manual: remove it when the wait is over.

grupo = "⚔️ Dungeon Tactics"
pastas = ['D:\Projetos\my-game']
horas_sessao_nova = 24
# Optional: where the per-asset decisions are saved (read once when the server starts).
# decisoes = 'data/decisoes.json'

[[sessoes]]
sessao = "local_example-1"
id = "impl"
nome = "Orquestrador Dungeon Tactics"
emoji = "🧭"
papel = "junta commits, roda gates, publica"

