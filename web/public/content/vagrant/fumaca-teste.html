<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fumaça volumétrica — teste</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c1020; color: #dfe6f5; font: 15px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; max-width: 100%; touch-action: none; }
  #painel { position: fixed; left: 8px; top: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; }
  #painel > * { pointer-events: auto; }
  button { font: inherit; min-height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid #44507a; background: #1a2140; color: inherit; cursor: pointer; }
  button.on { background: #b9651f; border-color: #f0a050; color: #fff; }
  #num { background: #0c1020cc; padding: 8px 12px; border-radius: 8px; font-variant-numeric: tabular-nums; }
  #rel { position: fixed; left: 8px; bottom: 8px; right: 8px; max-height: 40%; overflow: auto; margin: 0; background: #0c1020e6; padding: 10px; border-radius: 8px; font: 14px/1.4 ui-monospace, monospace; white-space: pre-wrap; }
  #rel:empty { display: none; }
</style>
</head>
<body>
<div id="painel">
  <span>Fumaça:</span>
  <button data-q="desligada">Desligada</button><button data-q="baixa">Baixa</button><button data-q="alta">Alta</button>
  <button data-v="perto">Vista de perto</button><button data-v="longe">Vista de longe</button>
  <button id="medir">Medir as três</button><button id="copiar">Copiar relatório</button>
  <span id="num" aria-live="off">…</span>
</div>
<pre id="rel"></pre>
<script type="module">
import * as THREE from './src/three.js';
import { criarFumaca } from './fumaca.js?v=13';

// ?tam=1130x847 fixes the canvas size (pixel ratio 1) for comparable measurements; ?semprof tests the fallback without a depth texture
const P = new URLSearchParams(location.search), tam = (P.get('tam') || '').split('x').map(Number);
const canvas = document.createElement('canvas'); document.body.prepend(canvas);
const renderer = new THREE.WebGLRenderer({ canvas }); // three 0.117 opens WebGL 1, like the room page
const fixo = tam.length === 2 && tam[0] > 0 && tam[1] > 0;
const ajustar = () => {
  const w = fixo ? tam[0] : innerWidth, h = fixo ? tam[1] : innerHeight;
  renderer.setPixelRatio(fixo ? 1 : Math.min(devicePixelRatio, 2)); renderer.setSize(w, h, !fixo ? true : false);
  if (fixo) { canvas.style.width = w + 'px'; canvas.style.height = 'auto'; }
  camera.aspect = w / h; camera.updateProjectionMatrix();
};
renderer.setClearColor(0x0c1020, 1);
const gl = renderer.getContext();

const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
scene.add(new THREE.AmbientLight(0x5a6890, 0.5));
const pedra = (c) => new THREE.MeshPhongMaterial({ color: c, shininess: 4 });
const por = (m, x, y, z) => { m.position.set(x, y, z); scene.add(m); return m; };
const chao = por(new THREE.Mesh(new THREE.PlaneBufferGeometry(24, 24), pedra(0x4a4e5c)), 0, 0, 0); chao.rotation.x = -Math.PI / 2;
por(new THREE.Mesh(new THREE.BoxBufferGeometry(24, 7, 0.5), pedra(0x3c4050)), 0, 3.5, -12);
por(new THREE.Mesh(new THREE.BoxBufferGeometry(0.5, 7, 24), pedra(0x3c4050)), -12, 3.5, 0);
for (const x of [-3.5, 3.5]) por(new THREE.Mesh(new THREE.CylinderBufferGeometry(0.6, 0.7, 7, 12), pedra(0x5a5e6c)), x, 3.5, -4);
por(new THREE.Mesh(new THREE.CylinderBufferGeometry(0.35, 0.35, 1.8, 12), pedra(0x8a3030)), 0, 0.9, 0); // the stand-in character

// same fire as the room: colour (1, 0.62, 0.3), reach 10, decay 2; the middle one is a floor brazier
const FOGOS = [{ p: [-3.5, 2.6, -3.2], forca: 1.3 }, { p: [3.5, 2.6, -3.2], forca: 1.3 }, { p: [1.5, 0.9, 3], forca: 1.8 }];
const luzes = FOGOS.map((f, i) => {
  const l = new THREE.PointLight(new THREE.Color(1, 0.62, 0.3), f.forca, 10, 2); l.position.set(...f.p); scene.add(l);
  por(new THREE.Mesh(new THREE.SphereBufferGeometry(0.14, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffc070 })), ...f.p);
  if (i === 2) por(new THREE.Mesh(new THREE.CylinderBufferGeometry(0.4, 0.25, 0.8, 10), pedra(0x30303a)), f.p[0], 0.4, f.p[2]);
  return l;
});
const fumaca = criarFumaca({
  THREE, scene, camera, renderer, luzes, profundidade: !P.has('semprof'),
  caixa: { min: new THREE.Vector3(-12, 0, -12), max: new THREE.Vector3(12, 6, 12) },
  fontes: FOGOS.map((f) => ({ pos: new THREE.Vector3(f.p[0], f.p[1] + 0.2, f.p[2]), forca: f.forca })),
});

const controles = new THREE.OrbitControls(camera, canvas); controles.maxPolarAngle = Math.PI * 0.49;
const VISTAS = { perto: [[3.5, 2.8, 7.5], [0.3, 1.0, 0]], longe: [[13, 11, 17], [0, 0.5, -1]] };
const vista = (n) => { camera.position.set(...VISTAS[n][0]); controles.target.set(...VISTAS[n][1]); controles.update(); };
vista(P.get('vista') || 'perto'); ajustar(); addEventListener('resize', ajustar);

let q = 'alta', t = 0;
function qualidade(n) { q = n; fumaca.setQualidade(n); document.querySelectorAll('[data-q]').forEach((b) => b.classList.toggle('on', b.dataset.q === n)); }
qualidade(P.get('q') || 'alta');
document.querySelectorAll('[data-q]').forEach((b) => (b.onclick = () => qualidade(b.dataset.q)));
document.querySelectorAll('[data-v]').forEach((b) => (b.onclick = () => vista(b.dataset.v)));

const px = new Uint8Array(4);
// One frame. sincrono = wait for the GPU: gl.finish alone may return early in Chrome, the 1-pixel read cannot.
function quadro(dt = 1 / 60, sincrono = true) {
  t += dt;
  luzes.forEach((l, i) => (l.intensity = FOGOS[i].forca * (1 + 0.1 * Math.sin(t * 9.1 + i) + 0.06 * Math.sin(t * 23.3 + i * 3))));
  const t0 = performance.now();
  fumaca.update(dt, camera, luzes);
  renderer.render(scene, camera);
  if (sincrono) { gl.finish(); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); }
  return performance.now() - t0;
}
// Cost of one quality: 4 batches of 300 frames, the GPU awaited once per batch. Each wait snaps to the monitor's
// refresh (6.9 ms at 144 Hz): per frame that hid any cost below it, over 300 frames it is a 0.02 ms error.
// First batch thrown away (shader compile).
function medir(nome, lotes = 4, n = 300) {
  const antes = q; qualidade(nome);
  const ms = [];
  for (let l = 0; l <= lotes; l++) {
    const t0 = performance.now();
    for (let i = 0; i < n; i++) quadro(1 / 60, false);
    gl.finish(); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    if (l) ms.push((performance.now() - t0) / n);
  }
  qualidade(antes); quadro(0, false); ms.sort((x, y) => x - y); // one frame back in the old quality, so the stats are current
  return { media: +(ms.reduce((x, y) => x + y, 0) / lotes).toFixed(2), mediana: +ms[lotes >> 1].toFixed(2), pior: +ms[lotes - 1].toFixed(2) };
}
const dbg = gl.getExtension('WEBGL_debug_renderer_info');
const medidas = {};
function relatorio() {
  const e = fumaca.estatisticas, s = renderer.getDrawingBufferSize(new THREE.Vector2());
  const linha = (n) => medidas[n] ? `${n}: média ${medidas[n].media} ms · mediana ${medidas[n].mediana} ms · pior ${medidas[n].pior} ms` : `${n}: não medida`;
  const custo = (n) => medidas[n] && medidas.desligada ? `custo da fumaça ${n}: +${(medidas[n].mediana - medidas.desligada.mediana).toFixed(2)} ms por quadro` : '';
  return [
    'Fumaça volumétrica — relatório', new Date().toLocaleString('pt-BR'),
    `Placa de vídeo: ${dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : 'não informada'}`,
    `WebGL ${renderer.capabilities.isWebGL2 ? 2 : 1} · tela ${s.x}x${s.y} px · textura de profundidade: ${e.profundidade ? 'sim' : 'não'}`,
    `Qualidade agora: ${e.qualidade} (${e.passos} passos, ${e.largura}x${e.altura}) · ${e.luzes} luzes · ${e.fontes} fontes`,
    `Ao vivo: ${fps} quadros por segundo · ${msVivo.toFixed(2)} ms por quadro`,
    'Tempo por quadro (cena + fumaça; 4 lotes de 300 quadros, esperando a placa terminar a cada lote):',
    linha('desligada'), linha('baixa'), linha('alta'), custo('baixa'), custo('alta'), navigator.userAgent,
  ].filter(Boolean).join('\n');
}
const rel = document.getElementById('rel');
document.getElementById('medir').onclick = () => { for (const n of ['desligada', 'baixa', 'alta']) medidas[n] = medir(n); rel.textContent = relatorio(); };
document.getElementById('copiar').onclick = async () => {
  rel.textContent = relatorio();
  try { await navigator.clipboard.writeText(rel.textContent); rel.textContent += '\n\n(copiado)'; } catch { rel.textContent += '\n\n(não deu para copiar sozinho: selecione o texto acima)'; }
};

// real FPS = requestAnimationFrame calls in the last second; frame ms = one synchronous frame in every 10, averaged
let fps = 0, conta = 0, marco = performance.now(), msVivo = 0, k = 0;
const num = document.getElementById('num');
function laco() {
  requestAnimationFrame(laco);
  const sinc = ++k % 10 === 0, ms = quadro(Math.min(clock.getDelta(), 0.1), sinc);
  if (sinc) msVivo = msVivo ? msVivo * 0.7 + ms * 0.3 : ms;
  conta++; const agora = performance.now();
  if (agora - marco >= 1000) { fps = Math.round(conta * 1000 / (agora - marco)); conta = 0; marco = agora; num.textContent = `${fps} quadros/s · ${msVivo.toFixed(1)} ms por quadro`; }
}
const clock = new THREE.Clock(); laco();
// hooks for a hidden tab, where requestAnimationFrame does not run
Object.assign(window, { quadro, medir, vista, qualidade, relatorio, fumaca, camera });
</script>
</body>
</html>
