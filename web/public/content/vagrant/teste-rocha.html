<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste rocha IA</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#ddd;font:14px system-ui,sans-serif;overflow:hidden}
.rot{position:fixed;transform:translate(-50%,0);background:#000b;padding:4px 8px;border-radius:4px;white-space:pre;text-align:center;font-size:15px}
#info{position:fixed;left:12px;top:10px;background:#000a;padding:6px 10px;border-radius:4px;white-space:pre}
canvas{display:block;image-rendering:pixelated}
</style>
</head>
<body>
<div id="info">carregando…</div>
<script type="module">
// Standalone test (Nov 18): cave rock made by code (old) vs three AI tools reduced to ~250 triangles in headless Blender
// (ia-rocha/scripts/reduzir.py). Same room material and torch as teste-arco.html. Does not touch sala-fechada.html.
import { Scene, PerspectiveCamera, WebGLRenderer, Mesh, MeshLambertMaterial, MeshBasicMaterial, PlaneBufferGeometry,
  SphereBufferGeometry, PointLight, AmbientLight, Box3, Vector3, Fog } from 'https://unpkg.com/three@0.117.1/build/three.module.js';
import { GLTFLoader } from 'https://unpkg.com/three@0.117.1/examples/jsm/loaders/GLTFLoader.js';
import { OrbitControls } from 'https://unpkg.com/three@0.117.1/examples/jsm/controls/OrbitControls.js';

const V = 1; // raise when a .glb changes: the site caches static files
const BAIXA = 2;
const cena = new Scene();
cena.fog = new Fog(0x000000, 12, 26);
const cam = new PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
cam.position.set(0, 3.2, 8.2);
const r = new WebGLRenderer({ antialias: false });
r.setPixelRatio(1 / BAIXA);
r.setSize(innerWidth, innerHeight);
document.body.appendChild(r.domElement);
const ctl = new OrbitControls(cam, r.domElement);
ctl.target.set(0, 0.6, 0);
ctl.update();

const chao = new MeshLambertMaterial({ color: 0x2a2620 }), chao2 = new MeshLambertMaterial({ color: 0x332e27 });
for (let x = -7; x < 7; x++) for (let z = -3; z < 4; z++) {
  const m = new Mesh(new PlaneBufferGeometry(1, 1), (x + z) & 1 ? chao : chao2);
  m.rotation.x = -Math.PI / 2; m.position.set(x + 0.5, 0, z + 0.5); cena.add(m);
}
const tocha = new PointLight(0xffa050, 2.4, 14, 2);
tocha.position.set(0, 3, 3.5); cena.add(tocha);
cena.add(new Mesh(new SphereBufferGeometry(0.08, 6, 4), Object.assign(new MeshBasicMaterial({ color: 0xffc070 }), {})).translateX(0).translateY(3).translateZ(3.5));
cena.add(new AmbientLight(0x404858, 0.7));

const paraTela = (g) => {
  const c = g.attributes.color;
  const max = c.normalized ? 2 ** (8 * c.array.BYTES_PER_ELEMENT) - 1 : 1;
  for (let i = 0; i < c.array.length; i++) if (i % c.itemSize < 3) c.array[i] = Math.round(max * Math.pow(c.array[i] / max, 1 / 2.2) * 1e6) / 1e6;
  c.needsUpdate = true;
};
const carregar = (url) => new Promise((ok) => new GLTFLoader().load(url, (g) => {
  let malha; g.scene.traverse((o) => { if (o.isMesh) malha = o; });
  paraTela(malha.geometry);
  malha.material = new MeshLambertMaterial({ vertexColors: true });
  ok(malha);
}, undefined, () => ok(null)));
const tris = (m) => (m.geometry.index ? m.geometry.index.count : m.geometry.attributes.position.count) / 3;

const itens = [['rocha-caverna', 'por código (antiga)'], ['rocha-triposr', 'TripoSR'], ['rocha-hunyuan', 'Hunyuan3D 2.1'], ['rocha-trellis', 'TRELLIS.2']];
const rot = [], info = {};
const malhas = await Promise.all(itens.map(([n]) => carregar(`./glb/${n}.glb?v=${V}`)));
malhas.forEach((m, i) => {
  const [n, nome] = itens[i];
  if (!m) { info[n] = 'ausente'; return; }
  const b = new Box3().setFromObject(m), t = b.getSize(new Vector3());
  m.scale.setScalar(1.5 / Math.max(t.x, t.y, t.z)); // every rock is 1.5 m at its longest side, like the target
  m.position.set(-4.5 + i * 3, 0, 0);
  m.position.y = -new Box3().setFromObject(m).min.y;
  cena.add(m);
  info[n] = tris(m);
  const d = document.createElement('div'); d.className = 'rot'; d.textContent = `${nome}
${tris(m)} triângulos`;
  document.body.appendChild(d); rot.push([d, m.position.clone()]);
});
const desenhar = () => {
  r.render(cena, cam);
  for (const [d, p] of rot) { const q = p.clone().add(new Vector3(0, -0.1, 0.9)).project(cam); d.style.left = ((q.x + 1) / 2 * innerWidth) + 'px'; d.style.top = ((1 - q.y) / 2 * innerHeight) + 'px'; }
};
desenhar();
ctl.addEventListener('change', desenhar);
addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); r.setSize(innerWidth, innerHeight); desenhar(); });
window.__teste = { isWebGL2: r.capabilities.isWebGL2, triangulos: info };
document.getElementById('info').textContent = 'rochas de 1,5 m, 1 quadrado = 1 m · WebGL ' + (r.capabilities.isWebGL2 ? 2 : 1) + ' · three r117';
</script>
</body>
</html>
