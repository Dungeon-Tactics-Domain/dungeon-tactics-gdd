<!doctype html><meta charset=utf-8><title>Quadros das animações</title>
<style>body{margin:0;background:#222;color:#ddd;font:11px sans-serif}canvas{display:block}</style>
<div id=st>carregando…</div>
<script type="module" src="https://unpkg.com/three@0.116.1/build/three.module.js" crossorigin></script>
<script type="module" src="https://unpkg.com/three@0.116.1/examples/jsm/controls/OrbitControls.js" crossorigin></script>
<script type="module" src="https://unpkg.com/three@0.116.1/examples/jsm/exporters/OBJExporter.js" crossorigin></script>
<script type="module">
import { Scene, PerspectiveCamera, WebGLRenderer, Box3, Vector3, AnimationMixer } from './src/three.js';
import { ZUD } from './src/ZUD.js';
import { Reader } from './src/Reader.js';
const Q = new URLSearchParams(location.search), nome = Q.get('z') || 'Z001U00.ZUD', de = +Q.get('de') || 0, ate = +Q.get('ate') || 999, K = 5, W = 120, H = 150;
const z = new ZUD(new Reader(new Uint8Array(await (await fetch('./arq/MAP/' + nome)).arrayBuffer()))); z.read(); z.build();
const clips = z[Q.get('s') || 'bt'].animations.map((a) => a.animationClip).map((c, i) => [i, c]).filter(([i, c]) => i >= de && i <= ate && c.duration > 0.3);
const cv = document.createElement('canvas'); cv.width = K * W + 40; cv.height = clips.length * H; document.body.appendChild(cv);
const r = new WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H); r.setClearColor(0x333333, 1);
const g = cv.getContext('2d'), sc = new Scene(), mesh = z.shp.mesh; sc.add(mesh);
const mx = new AnimationMixer(mesh); mx.clipAction(clips[0][1], mesh).play(); mx.update(0.2); mesh.updateMatrixWorld(true);
const box = new Box3().setFromObject(mesh), c = box.getCenter(new Vector3()), s = box.getSize(new Vector3()), d = Math.max(s.x, s.y, s.z) * 2.2;
const cam = new PerspectiveCamera(40, W / H, 1, 1e5); cam.position.set(c.x + d * .45, c.y, c.z + d * .9); cam.lookAt(c);
clips.forEach(([i, cl], row) => {
  g.fillStyle = '#fff'; g.font = '12px sans-serif'; g.fillText('#' + i, 2, row * H + 14); g.fillText(cl.duration.toFixed(1) + 's', 2, row * H + 28);
  mx.stopAllAction(); const a = mx.clipAction(cl, mesh); a.play();
  for (let k = 0; k < K; k++) { a.time = cl.duration * k / K; mx.update(0); mesh.updateMatrixWorld(true); r.render(sc, cam); g.drawImage(r.domElement, 40 + k * W, row * H); }
});
document.getElementById('st').textContent = nome + ' · ' + clips.length + ' animações com movimento (5 quadros cada)';
</script>
