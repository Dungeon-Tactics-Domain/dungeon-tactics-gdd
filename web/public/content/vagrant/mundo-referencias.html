<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Referências do mundo</title>
<style>
  :root { color-scheme: light; --bg: #f7f5f0; --card: #fff; --txt: #1d1b18; --sub: #5a554c; --line: #ddd6c8; --accent: #8a4b12; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--txt); font: 16px/1.5 system-ui, sans-serif; }
  .wrap { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 24px; max-width: 1600px; margin: 0 auto; padding: 16px; }
  nav { position: sticky; top: 16px; align-self: start; }
  nav summary { font-weight: 700; cursor: pointer; min-height: 44px; display: flex; align-items: center; }
  nav a { display: block; padding: 10px 12px; color: var(--txt); text-decoration: none; border-left: 3px solid transparent; min-height: 44px; }
  nav a.on { border-left-color: var(--accent); background: #efe7d8; font-weight: 600; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  h2 { margin: 32px 0 8px; font-size: 22px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  p { margin: 0 0 12px; color: var(--sub); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  figure button { all: unset; display: block; width: 100%; cursor: zoom-in; }
  figure img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; background: #222; }
  figcaption { padding: 10px 12px; font-size: 16px; }
  figcaption b { display: block; }
  .tag { display: inline-block; font-size: 16px; background: #efe7d8; border-radius: 4px; padding: 0 6px; margin: 4px 4px 0 0; }
  dialog { border: 0; padding: 0; max-width: 96vw; max-height: 96vh; background: #111; }
  dialog img { display: block; max-width: 96vw; max-height: 88vh; }
  dialog p { color: #eee; padding: 8px 12px; margin: 0; }
  dialog::backdrop { background: rgb(0 0 0 / .8); }
  @media (max-width: 900px) {
    .wrap { grid-template-columns: minmax(0, 1fr); }
    nav { position: static; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; }
    .grid { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<div class="wrap">
  <nav><details id="sum" open><summary>Sumário</summary><div id="links"></div></details></nav>
  <main>
    <h1>Referências do mundo</h1>

    <div id="secoes"></div>
  </main>
</div>
<dialog id="zoom"><img alt=""><p></p></dialog>

const sec = document.getElementById('secoes'), links = document.getElementById('links');
for (const [id, titulo, texto, itens] of SECOES) {
  const s = document.createElement('section'); s.id = id;
  s.innerHTML = `<h2>${titulo}</h2><p>${texto}</p><div class="grid"></div>`;
  for (const [f, t, d, tag] of itens) {
    const fig = document.createElement('figure');
    fig.innerHTML = `<button type="button" aria-label="Ampliar: ${t}"><img loading="lazy" src="${D + f}" alt="${t}"></button><figcaption><b>${t}</b>${d}<br><span class="tag">${tag}</span><span class="tag">Vista de cima</span></figcaption>`;
    if (!/de cima|vista/i.test(t + d)) fig.querySelector('.tag:last-child').remove();
    fig.querySelector('button').onclick = () => { const z = document.getElementById('zoom'); z.querySelector('img').src = D + f; z.querySelector('p').textContent = `${t} — ${d}`; z.showModal(); };
    s.querySelector('.grid').append(fig);
  }
  sec.append(s);
  const a = document.createElement('a'); a.href = '#' + id; a.textContent = titulo; links.append(a);
}
const zoom = document.getElementById('zoom');
zoom.onclick = () => zoom.close();
if (matchMedia('(max-width: 900px)').matches) document.getElementById('sum').open = false;
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) links.querySelectorAll('a').forEach(a => a.classList.toggle('on', a.hash === '#' + e.target.id)); }), { rootMargin: '-40% 0px -55% 0px' });
document.querySelectorAll('main section').forEach(s => io.observe(s));
