[package]
name = "labs-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
labs-core = { version = "0.1.0", path = "../labs-core" }
notify-debouncer-mini = "0.7.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
